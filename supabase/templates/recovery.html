<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#0b1f3a">
  <h2 style="color:#0b1f3a">Recuperação de senha</h2>
  <p>Recebemos um pedido para criar uma nova senha na sua conta do Controle Fácil.</p>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
        style="display:inline-block;background:#0b1f3a;color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:bold">Criar nova senha</a></p>
  <p style="font-size:12px;color:#64748b">Se você não fez esse pedido, ignore este e-mail. Sua senha continua a mesma.</p>
</div>

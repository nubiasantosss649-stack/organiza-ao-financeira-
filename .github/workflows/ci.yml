name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Testes de banco (RLS, isolamento, limites de plano)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database controle_facil_test"
          psql -h localhost -U postgres -d controle_facil_test -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql
          for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -d controle_facil_test -v ON_ERROR_STOP=1 -q -f "$f"; done
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/controle_facil_test npx vitest run tests/db
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
        run: npm run build
